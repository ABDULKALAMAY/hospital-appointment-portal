apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal
spec:
  replicas: 3
  revisionHistoryLimit: 6
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hospital-portal
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
        - name: hospital-portal
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30016
